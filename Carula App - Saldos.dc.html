<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#EDE7DC; font-family:'Manrope',sans-serif; font-variant-numeric: lining-nums tabular-nums; }
a { color:#E82C1B; text-decoration:none; }
a:hover { color:#2B2420; }
</style>
</helmet>

<div style="width:390px; background:#F6F2F5; border-radius:40px; overflow:hidden; box-shadow:0 30px 70px rgba(58,35,80,.26); display:flex; flex-direction:column; font-family:'Manrope',sans-serif">
  <!-- Header -->
  <div style="padding:20px; background:linear-gradient(155deg,#3A2350 0%,#6E3F72 60%,#A85E86 100%); display:flex; align-items:center; justify-content:space-between; gap:12px">
    <span style="font-family:'Instrument Serif',serif; font-size:29px; color:#FFFFFF; line-height:1.1">Saldos</span>
    <span style="display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); color:#FFFFFF; font-weight:800; font-size:11px; padding:9px 14px; border-radius:14px; white-space:nowrap; cursor:pointer; transition:all .22s ease" style-hover="background:#FFFFFF; color:#3A2350"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Novo Saldo</span>
  </div>

  <!-- Content -->
  <div style="padding:18px; display:flex; flex-direction:column; gap:14px; margin-top:-14px; background:#F6F2F5; border-radius:28px 28px 0 0; overflow-y:auto; max-height:550px;">
    <!-- Summary Cards -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
      <div style="background:linear-gradient(135deg,#0D8659 0%,#15a869 100%); border-radius:18px; padding:16px; color:#FFFFFF; box-shadow:0 8px 20px rgba(13,134,89,.2)">
        <div style="font-size:11px; opacity:0.9; margin-bottom:8px">Receita Total</div>
        <div style="font-size:24px; font-weight:800">R$ 18.420</div>
        <div style="font-size:10px; opacity:0.8; margin-top:8px">+12% este mês</div>
      </div>
      <div style="background:linear-gradient(135deg,#E82C1B 0%,#ff4941 100%); border-radius:18px; padding:16px; color:#FFFFFF; box-shadow:0 8px 20px rgba(232,44,27,.2)">
        <div style="font-size:11px; opacity:0.9; margin-bottom:8px">Despesas</div>
        <div style="font-size:24px; font-weight:800">R$ 3.850</div>
        <div style="font-size:10px; opacity:0.8; margin-top:8px">Estoque + Fornecedores</div>
      </div>
    </div>

    <!-- Net Balance -->
    <div style="background:linear-gradient(135deg,#3A2350 0%,#6E3F72 55%,#A85E86 100%); border-radius:18px; padding:20px; color:#FFFFFF; text-align:center; box-shadow:0 12px 30px rgba(58,35,80,.2)">
      <div style="font-size:12px; opacity:0.95; margin-bottom:10px">Saldo Líquido</div>
      <div style="font-size:36px; font-weight:800; margin-bottom:6px">R$ 14.570</div>
      <div style="font-size:11px; opacity:0.85">Período: Este Mês</div>
    </div>

    <!-- Transactions -->
    <div style="margin-top:8px">
      <h3 style="margin:0 0 12px 0; font-size:14px; font-weight:800; color:#2B2420">Movimentação Recente</h3>
      <div style="display:flex; flex-direction:column; gap:10px">
        <sc-for list="{{ transacoes }}" as="tx" hint-placeholder-count="4">
          <div style="display:flex; align-items:center; gap:12px; padding:12px; background:#FFFFFF; border-radius:14px; box-shadow:0 2px 6px rgba(58,35,80,.06)">
            <div style="width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; background:{{ tx.iconBg }}">{{ tx.icon }}</div>
            <div style="flex:1">
              <div style="font-size:13px; font-weight:700; color:#2B2420; margin-bottom:2px">{{ tx.descricao }}</div>
              <div style="font-size:11px; color:#A096A6">{{ tx.data }}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:13px; font-weight:800; color:{{ tx.color }}">{{ tx.valor }}</div>
              <div style="font-size:10px; color:#A096A6">{{ tx.categoria }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div style="margin-top:auto; background:#FFFFFF; border-top:1px solid rgba(36,27,43,.08); padding:12px 8px 22px; display:flex; justify-content:space-around; box-shadow:0 -8px 24px rgba(58,35,80,.07)">
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A096A6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span style="font-size:9px; font-weight:600; color:#A096A6">Início</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A096A6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.2 13H5.2z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg><span style="font-size:9px; font-weight:600; color:#A096A6">Pedidos</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A096A6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h9a3 3 0 0 1 3 3v13H6a2 2 0 0 1-2-2z"></path><path d="M20 5v15"></path></svg><span style="font-size:9px; font-weight:600; color:#A096A6">Fichas</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A096A6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3.5 20a5.5 5.5 0 0 1 11 0"></path><circle cx="17.5" cy="10" r="2.2"></circle></svg><span style="font-size:9px; font-weight:600; color:#A096A6">Clientes</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A096A6" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="10" width="8" height="7" rx="1.2"></rect><rect x="13" y="10" width="8" height="7" rx="1.2"></rect><rect x="8" y="3" width="8" height="6" rx="1.2"></rect></svg><span style="font-size:9px; font-weight:600; color:#A096A6">Estoque</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; background:#3A2350; box-shadow:0 8px 18px rgba(58,35,80,.3); cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F5B9C6" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><circle cx="17" cy="12.5" r="1.4" fill="#F5B9C6" stroke="none"></circle></svg><span style="font-size:9px; font-weight:800; color:#F5B9C6">Saldos</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;390px&quot;,&quot;height&quot;:&quot;844px&quot;}}">
class Component extends DCLogic {
  state = {
    transacoes: [],
  };

  componentDidMount() {
    this.loadTransacoes();
  }

  loadTransacoes = () => {
    const transacoes = [
      {
        descricao: 'Venda - Marina Duarte',
        data: 'Hoje às 14:30',
        valor: '+R$ 450,00',
        categoria: 'Receita',
        icon: '🛍️',
        iconBg: '#E8F8EE',
        color: '#0D8659',
      },
      {
        descricao: 'Reabastecimento Fornecedor A',
        data: 'Ontem',
        valor: '-R$ 1.200,00',
        categoria: 'Despesa',
        icon: '📦',
        iconBg: '#FFE8E8',
        color: '#E82C1B',
      },
      {
        descricao: 'Venda - Júlia Prado',
        data: '14 de Agosto',
        valor: '+R$ 320,00',
        categoria: 'Receita',
        icon: '🛍️',
        iconBg: '#E8F8EE',
        color: '#0D8659',
      },
      {
        descricao: 'Aluguel Loja',
        data: '12 de Agosto',
        valor: '-R$ 2.500,00',
        categoria: 'Despesa',
        icon: '🏪',
        iconBg: '#FFE8E8',
        color: '#E82C1B',
      },
      {
        descricao: 'Venda - Ana Lúcia',
        data: '11 de Agosto',
        valor: '+R$ 780,00',
        categoria: 'Receita',
        icon: '🛍️',
        iconBg: '#E8F8EE',
        color: '#0D8659',
      },
    ];
    this.setState({ transacoes });
  };

  renderVals = () => {
    const { transacoes } = this.state;
    return { transacoes };
  };
}

</script>
</body>
</html>
