<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar Ficha Técnica — Preço</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#6E3F72}a:hover{color:#3A2350}
.card{transition:transform .32s cubic-bezier(.2,.8,.3,1), box-shadow .32s cubic-bezier(.2,.8,.3,1)}
.card:hover{transform:translateY(-5px) rotate(-.25deg);box-shadow:0 1px 1px rgba(58,35,80,.04), 0 10px 18px -6px rgba(58,35,80,.12), 0 30px 48px -16px rgba(58,35,80,.32)}
.price{border:none;outline:none;background:transparent;font-family:'Manrope',sans-serif;font-weight:800;font-size:44px;letter-spacing:-.03em;color:#241B2B;width:100%;min-width:0;text-align:right;padding:0 0 6px;background-image:linear-gradient(90deg,#6E3F72,#C4626F);background-size:0% 2px;background-repeat:no-repeat;background-position:100% 100%;transition:background-size .35s ease}
.price::placeholder{color:#C9BCCD}
.price:focus{background-size:100% 2px}
.btn{transition:transform .22s ease, box-shadow .22s ease}
.btn:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion: reduce){.card,.btn,.price{transition:none}.card:hover,.btn:hover{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F2F5; font-family: 'Manrope', sans-serif; color: #241B2B; display: flex; flex-direction: column">

  <!-- Cabeçalho roxo (igual ao atual) -->
  <header style="flex-shrink: 0; padding: 30px 20px 44px; background: linear-gradient(155deg, #3A2350 0%, #6E3F72 60%, #A85E86 100%)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 28px; line-height: 1.1; color: #FFFFFF">Criar Nova Ficha Técnica</h1>
      <button aria-label="Fechar" style="width: 36px; height: 36px; border: none; border-radius: 11px; background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 100%; height: 3px; border-radius: 999px; background: #F5B9C6"></div><span style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,.75)">1 · Identificação</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 100%; height: 3px; border-radius: 999px; background: #F5B9C6"></div><span style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,.75)">2 · Insumos</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 100%; height: 3px; border-radius: 999px; background: #F5B9C6"></div><span style="font-size: 11px; font-weight: 800; color: #FFFFFF">3 · Preço</span></div>
    </div>
  </header>

  <main style="flex: 1; margin-top: -28px; border-radius: 28px 28px 0 0; background: #F6F2F5; padding: 22px 18px 120px; display: flex; flex-direction: column; gap: 14px">

    <section class="card" style="position: relative; overflow: hidden; background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 1px rgba(58,35,80,.04), 0 6px 12px -4px rgba(58,35,80,.08), 0 20px 34px -14px rgba(58,35,80,.22)">

      <!-- Preço de venda -->
      <div style="padding: 16px 18px 16px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #7A6E80">PREÇO DE VENDA</span>
          <span style="background: #F3E9F3; color: #3A2350; font-size: 10px; font-weight: 800; padding: 5px 10px; border-radius: 999px; white-space: nowrap">Tamanho · (sem nome)</span>
        </div>
        <label style="display: flex; align-items: flex-end; gap: 10px; margin-top: 10px; border-bottom: 1.5px dashed rgba(110,63,114,.25)">
          <span style="font-family: 'Instrument Serif', serif; font-size: 34px; line-height: 1; color: #D6B8E0; padding-bottom: 10px">$</span>
          <input class="price" placeholder="0,00" inputmode="decimal" aria-label="Preço de venda em dólares">
        </label>
      </div>

      <!-- Picote -->
      <div style="position: relative; height: 0; border-top: 1.5px dashed rgba(36,27,43,.12); margin: 0 14px">
        <div style="position: absolute; left: -23px; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: #F6F2F5"></div>
        <div style="position: absolute; right: -23px; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: #F6F2F5"></div>
      </div>

      <!-- Custos (estilo comanda) -->
      <div style="padding: 14px 18px 14px; display: flex; flex-direction: column; gap: 9px">
        <span style="font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #7A6E80">CUSTOS</span>
        <div style="display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 600; color: #5B4A6B">
          <span style="width: 8px; height: 8px; border-radius: 3px; background: #6E3F72; flex-shrink: 0"></span>Insumos
          <span style="flex: 1; border-bottom: 1.5px dotted rgba(110,63,114,.25); transform: translateY(-3px)"></span>
          <span style="font-weight: 800; color: #241B2B">$0.00</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 600; color: #5B4A6B">
          <span style="width: 8px; height: 8px; border-radius: 3px; background: #C4626F; flex-shrink: 0"></span>Mão de obra
          <span style="flex: 1; border-bottom: 1.5px dotted rgba(110,63,114,.25); transform: translateY(-3px)"></span>
          <span style="font-weight: 800; color: #241B2B">$0.00</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 600; color: #5B4A6B">
          <span style="width: 8px; height: 8px; border-radius: 3px; background: #B08D57; flex-shrink: 0"></span>Despesas
          <span style="flex: 1; border-bottom: 1.5px dotted rgba(110,63,114,.25); transform: translateY(-3px)"></span>
          <span style="font-weight: 800; color: #241B2B">$0.00</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 600; color: #5B4A6B">
          <span style="width: 8px; height: 8px; border-radius: 3px; background: #D6B8E0; flex-shrink: 0"></span>Investimento
          <span style="flex: 1; border-bottom: 1.5px dotted rgba(110,63,114,.25); transform: translateY(-3px)"></span>
          <span style="font-weight: 800; color: #241B2B">$0.00</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px; padding: 11px 14px; border-radius: 16px; background: #F6F2F5">
          <span style="font-family: 'Instrument Serif', serif; font-size: 20px; line-height: 1">Custo total</span>
          <span style="font-size: 18px; font-weight: 800; letter-spacing: -.02em">$0.00</span>
        </div>
      </div>

      <div style="position: relative; height: 0; border-top: 1.5px dashed rgba(36,27,43,.12); margin: 0 14px">
        <div style="position: absolute; left: -23px; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: #F6F2F5"></div>
        <div style="position: absolute; right: -23px; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: #F6F2F5"></div>
      </div>

      <!-- Lucro -->
      <div style="padding: 14px 18px 18px">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 18px; background: rgba(169,216,184,.28); border: 1px solid rgba(76,115,88,.18)">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="width: 32px; height: 32px; border-radius: 10px; background: #A9D8B8; display: flex; align-items: center; justify-content: center">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#26402F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"></path></svg>
            </span>
            <div style="display: flex; flex-direction: column">
              <span style="font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #4C7358">LUCRO</span>
              <span style="font-size: 13px; font-weight: 700; color: #26402F">neste preço</span>
            </div>
          </div>
          <span style="font-size: 26px; font-weight: 800; letter-spacing: -.03em; color: #26402F">$0.00</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Barra de ações -->
  <footer style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 18px 26px; background: #FFFFFF; border-top: 1px solid rgba(36,27,43,.06); box-shadow: 0 -8px 24px rgba(58,35,80,.07); display: flex; gap: 10px">
    <button class="btn" style="width: 96px; height: 52px; flex-shrink: 0; border-radius: 16px; border: 1px solid rgba(110,63,114,.18); background: #FFFFFF; box-shadow: 0 4px 12px rgba(58,35,80,.08); font-family: inherit; font-size: 14px; font-weight: 800; color: #3A2350; cursor: pointer">Voltar</button>
    <button class="btn" style="flex: 1; height: 52px; border-radius: 16px; border: none; background: #3A2350; box-shadow: 0 10px 20px rgba(58,35,80,.3); font-family: inherit; font-size: 15px; font-weight: 800; color: #F5B9C6; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F5B9C6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      Salvar ficha técnica
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
