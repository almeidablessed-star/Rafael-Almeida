<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar Ficha Técnica — Insumos v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#6E3F72}a:hover{color:#3A2350}
.card{transition:transform .32s cubic-bezier(.2,.8,.3,1), box-shadow .32s cubic-bezier(.2,.8,.3,1)}
.card:hover{transform:translateY(-5px) rotate(-.25deg);box-shadow:0 1px 1px rgba(58,35,80,.04), 0 10px 18px -6px rgba(58,35,80,.12), 0 30px 48px -16px rgba(58,35,80,.32)}
.ink{border:none;outline:none;background:transparent;font-family:'Instrument Serif',serif;font-size:23px;color:#241B2B;padding:2px 0 7px;width:100%;background-image:linear-gradient(90deg,#6E3F72,#C4626F);background-size:0% 2px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .35s ease}
.ink::placeholder{color:#B3A6B8;font-style:italic}
.ink:focus{background-size:100% 2px}
.num{border:none;outline:none;background:transparent;font-family:'Manrope',sans-serif;font-weight:800;color:#241B2B;text-align:center;width:100%;min-width:0}
.num::placeholder{color:#B3A6B8}
.step{transition:transform .18s ease, box-shadow .18s ease}
.step:hover{transform:translateY(-2px);box-shadow:0 6px 12px rgba(58,35,80,.18)}
.step:active{transform:translateY(1px) scale(.96)}
.btn{transition:transform .22s ease, box-shadow .22s ease}
.btn:hover{transform:translateY(-3px)}
.add{transition:transform .28s ease, border-color .28s ease}
.add:hover{transform:translateY(-3px) rotate(-.5deg);border-color:#C4626F}
@media (prefers-reduced-motion: reduce){.card,.step,.btn,.add,.ink{transition:none}.card:hover,.step:hover,.btn:hover,.add:hover{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 1180px; position: relative; overflow: hidden; background: #F6F2F5; font-family: 'Manrope', sans-serif; color: #241B2B; display: flex; flex-direction: column">

  <!-- Cabeçalho roxo (igual ao atual) -->
  <header style="flex-shrink: 0; padding: 30px 20px 44px; background: linear-gradient(155deg, #3A2350 0%, #6E3F72 60%, #A85E86 100%)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 28px; line-height: 1.1; color: #FFFFFF">Criar Nova Ficha Técnica</h1>
      <button aria-label="Fechar" style="width: 36px; height: 36px; border: none; border-radius: 11px; background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 100%; height: 3px; border-radius: 999px; background: #F5B9C6"></div><span style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,.75)">1 · Identificação</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 100%; height: 3px; border-radius: 999px; background: #F5B9C6"></div><span style="font-size: 11px; font-weight: 800; color: #FFFFFF">2 · Insumos</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 100%; height: 3px; border-radius: 999px; background: rgba(255,255,255,.25)"></div><span style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,.6)">3 · Preço</span></div>
    </div>
  </header>

  <main style="flex: 1; margin-top: -28px; border-radius: 28px 28px 0 0; background: #F6F2F5; padding: 22px 18px 120px; display: flex; flex-direction: column; gap: 14px">

    <!-- Insumos -->
    <sc-for list="{{insumos}}" as="item" hint-placeholder-count="3">
      <section class="card" style="position: relative; overflow: hidden; background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 1px rgba(58,35,80,.04), 0 6px 12px -4px rgba(58,35,80,.08), 0 20px 34px -14px rgba(58,35,80,.22)">

        <!-- Ingrediente -->
        <div style="display: flex; align-items: flex-end; gap: 12px; padding: 16px 16px 14px 18px">
          <span style="font-family: 'Instrument Serif', serif; font-size: 34px; line-height: 1; color: #D6B8E0; padding-bottom: 7px">{{item.n}}</span>
          <label style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; border-bottom: 1.5px dashed rgba(110,63,114,.25)">
            <span style="font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #7A6E80">INGREDIENTE</span>
            <input class="ink" placeholder="Ex: Cacau em pó">
          </label>
          <button aria-label="{{item.remover}}" class="step" style="align-self: center; width: 32px; height: 32px; flex-shrink: 0; border: none; border-radius: 10px; background: #FBECEE; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C4626F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
          </button>
        </div>

        <!-- Picote da comanda -->
        <div style="position: relative; height: 0; border-top: 1.5px dashed rgba(36,27,43,.12); margin: 0 14px">
          <div style="position: absolute; left: -23px; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: #F6F2F5"></div>
          <div style="position: absolute; right: -23px; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: #F6F2F5"></div>
        </div>

        <!-- Quantidade + custo -->
        <div style="display: flex; align-items: flex-end; gap: 10px; padding: 12px 16px 16px 18px">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #7A6E80">QTD. NA RECEITA</span>
            <div style="height: 44px; box-sizing: border-box; padding: 4px 4px 4px 14px; border-radius: 15px; background: #F6F2F5; box-shadow: inset 0 1px 3px rgba(58,35,80,.08); display: flex; align-items: center; gap: 8px">
              <input class="num" placeholder="Ex: 450" aria-label="Quantidade" inputmode="decimal" style="font-size: 17px; text-align: left">
              <button aria-label="Unidade: gramas" class="step" style="height: 36px; flex-shrink: 0; border: none; border-radius: 11px; background: #3A2350; padding: 0 9px 0 11px; display: flex; align-items: center; gap: 4px; font-family: inherit; font-size: 13px; font-weight: 800; color: #F5B9C6; cursor: pointer">g
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#F5B9C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
              </button>
            </div>
          </div>
          <!-- Etiqueta de custo -->
          <div style="width: 86px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #7A6E80; text-align: right">CUSTO</span>
            <div style="position: relative; height: 44px; box-sizing: border-box; border-radius: 6px 15px 15px 6px; background: #FCEFF2; border: 1px solid rgba(196,98,111,.2); display: flex; align-items: center; justify-content: flex-end; padding-right: 12px">
              <div style="position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 7px; height: 7px; border-radius: 50%; background: #FFFFFF; box-shadow: inset 0 1px 2px rgba(196,98,111,.4)"></div>
              <span style="font-size: 15px; font-weight: 800; letter-spacing: -.02em; color: #3A2350">$0.00</span>
            </div>
          </div>
        </div>
      </section>
    </sc-for>

    <!-- Adicionar insumo -->
    <button class="add" style="position: relative; height: 56px; border-radius: 20px; border: 1.5px dashed rgba(110,63,114,.35); background: transparent; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Instrument Serif', serif; font-size: 21px; color: #3A2350; cursor: pointer">
      <span style="width: 30px; height: 30px; border-radius: 10px; background: #F5B9C6; box-shadow: 0 6px 12px rgba(196,98,111,.3); display: flex; align-items: center; justify-content: center">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3A2350" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
      Adicionar insumo
    </button>

    <!-- Mão de obra -->
    <section class="card" style="position: relative; overflow: hidden; background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 1px rgba(58,35,80,.04), 0 6px 12px -4px rgba(58,35,80,.08), 0 20px 34px -14px rgba(58,35,80,.22)">
      <div style="padding: 16px 18px 14px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="display: flex; flex-direction: column">
            <span style="font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #7A6E80">TEMPO DE PRODUÇÃO</span>
            <span style="font-family: 'Instrument Serif', serif; font-size: 24px; line-height: 1.15">Mão de obra</span>
          </div>
          <span style="width: 38px; height: 38px; border-radius: 12px; background: #F3E9F3; display: flex; align-items: center; justify-content: center">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E3F72" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 1.5M9 2h6"></path></svg>
          </span>
        </div>

        <!-- Relógio HH : MM × $/h -->
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 14px">
          <label style="flex: 1; height: 70px; box-sizing: border-box; border-radius: 18px; background: #F6F2F5; box-shadow: inset 0 1px 3px rgba(58,35,80,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
            <input class="num" placeholder="00" style="font-size: 30px; letter-spacing: -.03em; line-height: 1.1">
            <span style="font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #7A6E80">HORAS</span>
          </label>
          <span style="font-size: 26px; font-weight: 800; color: #D6B8E0">:</span>
          <label style="flex: 1; height: 70px; box-sizing: border-box; border-radius: 18px; background: #F6F2F5; box-shadow: inset 0 1px 3px rgba(58,35,80,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
            <input class="num" placeholder="00" style="font-size: 30px; letter-spacing: -.03em; line-height: 1.1">
            <span style="font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #7A6E80">MINUTOS</span>
          </label>
          <span style="font-size: 16px; font-weight: 800; color: #D6B8E0">×</span>
          <label style="width: 86px; height: 70px; box-sizing: border-box; border-radius: 18px; background: #FCEFF2; border: 1px solid rgba(196,98,111,.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
            <span style="display: flex; align-items: baseline; justify-content: center; width: 100%; font-size: 15px; font-weight: 800; color: #3A2350">$<input class="num" value="20" style="font-size: 26px; letter-spacing: -.03em; width: 40px; color: #3A2350"></span>
            <span style="font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #C4626F">POR HORA</span>
          </label>
        </div>
      </div>

      <div style="position: relative; height: 0; border-top: 1.5px dashed rgba(36,27,43,.12); margin: 0 14px">
        <div style="position: absolute; left: -23px; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: #F6F2F5"></div>
        <div style="position: absolute; right: -23px; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: #F6F2F5"></div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 16px">
        <span style="font-size: 12px; font-weight: 700; color: #5B4A6B">Total de mão de obra</span>
        <span style="font-size: 24px; font-weight: 800; letter-spacing: -.03em; color: #3A2350">$0.00</span>
      </div>
    </section>
  </main>

  <!-- Barra de ações -->
  <footer style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 18px 26px; background: #FFFFFF; border-top: 1px solid rgba(36,27,43,.06); box-shadow: 0 -8px 24px rgba(58,35,80,.07); display: flex; gap: 10px">
    <button class="btn" style="width: 96px; height: 52px; flex-shrink: 0; border-radius: 16px; border: 1px solid rgba(110,63,114,.18); background: #FFFFFF; box-shadow: 0 4px 12px rgba(58,35,80,.08); font-family: inherit; font-size: 14px; font-weight: 800; color: #3A2350; cursor: pointer">Voltar</button>
    <button class="btn" style="flex: 1; height: 52px; border-radius: 16px; border: none; background: #3A2350; box-shadow: 0 10px 20px rgba(58,35,80,.3); font-family: inherit; font-size: 15px; font-weight: 800; color: #F5B9C6; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      Continuar
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F5B9C6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      insumos: [
        { n: '01', remover: 'Remover insumo 1' },
        { n: '02', remover: 'Remover insumo 2' },
        { n: '03', remover: 'Remover insumo 3' }
      ]
    };
  }
}
</script>
</body>
</html>
