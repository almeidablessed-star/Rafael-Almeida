<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#EDE7DC; font-family:'Manrope',sans-serif; font-variant-numeric: lining-nums tabular-nums; }
a { color:#E82C1B; text-decoration:none; }
a:hover { color:#2B2420; }
</style>
</helmet>

<div style="width:390px; background:#F6F2F5; border-radius:40px; overflow:hidden; box-shadow:0 30px 70px rgba(58,35,80,.26); display:flex; flex-direction:column; font-family:'Manrope',sans-serif">
  <!-- Header -->
  <div style="padding:20px; background:linear-gradient(155deg,#3A2350 0%,#6E3F72 60%,#A85E86 100%); display:flex; align-items:center; justify-content:space-between; gap:12px">
    <span style="font-family:'Instrument Serif',serif; font-size:29px; color:#FFFFFF; line-height:1.1">Estoque</span>
    <span style="display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); color:#FFFFFF; font-weight:800; font-size:11px; padding:9px 14px; border-radius:14px; white-space:nowrap; cursor:pointer; transition:all .22s ease" style-hover="background:#FFFFFF; color:#3A2350"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Novo Item</span>
  </div>

  <!-- Content -->
  <div style="padding:18px; display:flex; flex-direction:column; gap:14px; margin-top:-14px; background:#F6F2F5; border-radius:28px 28px 0 0; overflow-y:auto; max-height:550px;">
    <!-- Search -->
    <div style="position:relative">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A096A6" stroke-width="2" stroke-linecap="round" style="position:absolute; left:14px; top:50%; transform:translateY(-50%)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <div style="padding:12px 14px 12px 36px; background:#FFFFFF; border-radius:14px; font-size:11px; color:#A096A6; box-shadow:0 6px 14px rgba(58,35,80,.07)">Buscar item no estoque...</div>
    </div>

    <!-- Stock Items Grid -->
    <div style="display:grid; grid-template-columns:1fr; gap:12px">
      <sc-for list="{{ itens }}" as="item" hint-placeholder-count="3">
        <div style="background:#FFFFFF; border-radius:18px; padding:16px; box-shadow:0 4px 12px rgba(58,35,80,.08); cursor:pointer; transition:all .28s ease" style-hover="box-shadow:0 12px 28px rgba(58,35,80,.16); transform:translateY(-2px)">
          <div style="display:flex; align-items:flex-start; gap:14px; margin-bottom:12px">
            <div style="width:64px; height:64px; background:linear-gradient(135deg,#3A2350,#A85E86); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:28px">{{ item.emoji }}</div>
            <div style="flex:1">
              <h3 style="margin:0 0 4px 0; font-size:16px; font-weight:800; color:#2B2420">{{ item.nome }}</h3>
              <p style="margin:0; font-size:12px; color:#A096A6">SKU: {{ item.sku }}</p>
            </div>
          </div>
          
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; padding:12px; background:#F6F2F5; border-radius:12px">
            <div>
              <div style="font-size:11px; color:#A096A6; margin-bottom:4px">Quantidade</div>
              <div style="font-size:20px; font-weight:800; color:#3A2350">{{ item.quantidade }}</div>
            </div>
            <div>
              <div style="font-size:11px; color:#A096A6; margin-bottom:4px">Preço Unit.</div>
              <div style="font-size:20px; font-weight:800; color:#3A2350">{{ item.preco }}</div>
            </div>
          </div>

          <div style="display:flex; gap:8px; margin-bottom:12px">
            <div style="flex:1; padding:8px 12px; background:#E8F0FF; border-radius:10px; font-size:12px; font-weight:700; color:#0066CC; text-align:center">Local: {{ item.local }}</div>
            <div style="flex:1; padding:8px 12px; background:{{ item.statusBg }}; border-radius:10px; font-size:12px; font-weight:700; color:{{ item.statusColor }}; text-align:center">{{ item.status }}</div>
          </div>

          <div style="display:flex; gap:8px">
            <span style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px; height:32px; font-size:10px; font-weight:800; cursor:pointer; border-radius:12px; background:rgba(58,35,80,.1); color:#3A2350; transition:background .2s ease" style-hover="background:rgba(58,35,80,.2)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"></path></svg>Editar</span>
            <span style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px; height:32px; font-size:10px; font-weight:800; cursor:pointer; border-radius:12px; background:rgba(232,44,27,.08); color:#E82C1B; transition:background .2s ease" style-hover="background:rgba(232,44,27,.16)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>Deletar</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div style="margin-top:auto; background:#FFFFFF; border-top:1px solid rgba(36,27,43,.08); padding:12px 8px 22px; display:flex; justify-content:space-around; box-shadow:0 -8px 24px rgba(58,35,80,.07)">
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A096A6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span style="font-size:9px; font-weight:600; color:#A096A6">Início</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A096A6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.2 13H5.2z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg><span style="font-size:9px; font-weight:600; color:#A096A6">Pedidos</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A096A6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h9a3 3 0 0 1 3 3v13H6a2 2 0 0 1-2-2z"></path><path d="M20 5v15"></path></svg><span style="font-size:9px; font-weight:600; color:#A096A6">Fichas</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A096A6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3.5 20a5.5 5.5 0 0 1 11 0"></path><circle cx="17.5" cy="10" r="2.2"></circle></svg><span style="font-size:9px; font-weight:600; color:#A096A6">Clientes</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; background:#3A2350; box-shadow:0 8px 18px rgba(58,35,80,.3); cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F5B9C6" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="10" width="8" height="7" rx="1.2"></rect><rect x="13" y="10" width="8" height="7" rx="1.2"></rect><rect x="8" y="3" width="8" height="6" rx="1.2"></rect></svg><span style="font-size:9px; font-weight:800; color:#F5B9C6">Estoque</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 11px; border-radius:16px; cursor:pointer; transition:transform .25s ease" style-hover="transform:translateY(-4px)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A096A6" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><circle cx="17" cy="12.5" r="1.4" fill="#A096A6" stroke="none"></circle></svg><span style="font-size:9px; font-weight:600; color:#A096A6">Saldos</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;390px&quot;,&quot;height&quot;:&quot;844px&quot;}}">
class Component extends DCLogic {
  state = {
    itens: [],
  };

  componentDidMount() {
    this.loadItens();
  }

  loadItens = () => {
    const itens = [
      {
        nome: 'Camiseta Básica',
        sku: 'CAM-001',
        emoji: '👕',
        quantidade: 45,
        preco: 'R$ 39,90',
        local: 'Prateleira A',
        status: 'Em Estoque',
        statusBg: '#E8F8EE',
        statusColor: '#0D8659',
      },
      {
        nome: 'Vestido Floral',
        sku: 'VES-002',
        emoji: '👗',
        quantidade: 12,
        preco: 'R$ 89,90',
        local: 'Prateleira C',
        status: 'Baixo',
        statusBg: '#FFF4E6',
        statusColor: '#E67E22',
      },
      {
        nome: 'Calça Jeans',
        sku: 'CAL-003',
        emoji: '👖',
        quantidade: 0,
        preco: 'R$ 119,90',
        local: 'Prateleira B',
        status: 'Fora de Estoque',
        statusBg: '#FFE8E8',
        statusColor: '#E82C1B',
      },
      {
        nome: 'Jaqueta Denim',
        sku: 'JAC-004',
        emoji: '🧥',
        quantidade: 28,
        preco: 'R$ 159,90',
        local: 'Prateleira D',
        status: 'Em Estoque',
        statusBg: '#E8F8EE',
        statusColor: '#0D8659',
      },
      {
        nome: 'Bolsa Couro',
        sku: 'BOL-005',
        emoji: '👜',
        quantidade: 7,
        preco: 'R$ 249,90',
        local: 'Vitrine 1',
        status: 'Baixo',
        statusBg: '#FFF4E6',
        statusColor: '#E67E22',
      },
    ];
    this.setState({ itens });
  };

  renderVals = () => {
    const { itens } = this.state;
    return { itens };
  };
}

</script>
</body>
</html>
